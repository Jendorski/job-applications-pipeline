unverified:
  devops_cv:
    note: >-
      An older DevOps CV names different employers for the same periods and makes claims nothing in
      the code supports. Quarantined; never used by the pipeline.
    employers: [Company X, Company Y]   # the validator rejects any of these in generated text
    claims:
      - Prometheus + Grafana monitoring
      - Jenkins / GitLab CI pipelines
      - On-prem → AWS migration
    skills: [Kubernetes, Docker Swarm, Jenkins, GitLab CI, Terraform, CloudFormation, Ansible,
             Pulumi, Prometheus, Grafana, Datadog, PowerShell, Go, Azure]
