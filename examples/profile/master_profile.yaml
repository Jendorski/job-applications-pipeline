# ---------------------------------------------------------------------------
# Candidate: facts and motivations for application-form questions.
# Facts are copied, never invented; motivations are the candidate's own words to build answers from.
# ---------------------------------------------------------------------------
candidate:
  preferred_name: John Doe
  website: https://john-doe.example.com
  linkedin: https://www.linkedin.com/in/john-doe-example/
  based_in: Lisbon, Portugal
  relocation:
    open_to: [United States, United Kingdom, Europe, Singapore, Japan, Australia, New Zealand]
  work_authorisation: Authorised to work in the EU; would need visa sponsorship elsewhere.
  start: first week of next month          # rendered as a concrete date at answer time
  salary:
    rule: Within the posted salary range when the posting states one.
    fallback: USD 80,000–120,000 per year
  why_looking: >-
    Looking for long-term stability and a place to grow my career and contribute over the long run.
  proudest_project:
    bullet: company_a.erp_pipeline
    note: Say it with pride; this is the work the candidate is proudest of.
  motivation:
    source: user
    text: |-
      What motivates me is the gap between a system that seems to work and one that is actually right. I keep coming back to a problem until I understand it fully.

      My trading system is the clearest example. I started it while learning Rust, and it is now about 576 commits made on 182 different days. I rebuilt the core approach four times, and wrote smaller prototypes and backtests to test ideas before committing to them.

      The most useful lessons only appeared after the system ran for days: a position closed on the exchange that my bot didn't notice, and two machines that drew different conclusions from the same market. Each taught me to stop trusting my own state and verify it, which led to a reconciliation loop that compares my records with the exchange's.

