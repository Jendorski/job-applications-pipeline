<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The templates name "Garamond" so recipients opening the docx in Word get Microsoft Garamond.
     Inside the container that font isn't available, so map it to EB Garamond for PDFs. -->
<fontconfig>
  <alias binding="same">
    <family>Garamond</family>
    <prefer>
      <family>EB Garamond</family>
    </prefer>
  </alias>
</fontconfig>
