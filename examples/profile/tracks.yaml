# Base CV variants. A track is a complete, untailored CV: the pipeline picks the best track
# for a job, and the tailor then reorders and trims within the verified profile.
#
# summary may use {years} (computed from person.career_start). Every skill must be in the
# profile's allow-list, and every bullet/project id must be verified. `jap profile check`
# enforces both.

backend:
  label: Backend
  headlines:
    - Backend Engineer (Node.js / TypeScript / Python)
    - Senior Backend Engineer (Node.js / TypeScript)
    - Senior Backend Engineer (Python / FastAPI)
  summary: >-
    Backend engineer with {years}+ years building and running production services in industrial IoT,
    fintech and Web3. At Company A I build factory-monitoring backends in Python/FastAPI: machine data in
    from the shop floor, values written back to running machines, and SAP and ERP integrations that stay correct
    under retries and partial failure. Since 2023 at Company B I have been the main backend author of
    Node.js/TypeScript marketplace and escrow platforms on PostgreSQL and MongoDB. I specialise in
    event-driven, idempotent services that integrate with systems whose timing cannot be trusted:
    devices, ERPs, blockchains and payment providers.
  skill_groups:
    - label: Backend
      skills: [Node.js, TypeScript, Express, NestJS, Fastify, Python, FastAPI, REST API design, OpenAPI/Swagger]
    - label: Real-Time & Async
      skills: [Socket.IO, WebSockets, event-driven architecture, webhooks, outbox pattern, BullMQ, idempotency, exponential backoff]
    - label: Data
      skills: [PostgreSQL, MongoDB, MS SQL Server, Redis, SQLAlchemy, Alembic, Sequelize, Mongoose]
    - label: Integrations
      skills: [SAP (via MuleSoft), ERP REST APIs, Veriff, AWS S3, Google Cloud Storage, Anthropic API (Claude)]
    - label: Security
      skills: [JWT authentication, 2FA/OTP, API keys with scoped access, constant-time secret comparison, rate limiting]
    - label: Delivery & Infrastructure
      skills: [Docker, Docker Compose, GitHub Actions, Tailscale, Cloudflare Tunnel, AWS, GCP Cloud Run, Linux]
  experience:
    company_a: [company_a.monitoring_platform, company_a.erp_pipeline, company_a.device_writeback, company_a.erp_sync, company_a.security, company_a.deploy]
    company_b: [company_b.core_api, company_b.marketplace, company_b.onchain_payments, company_b.nestjs_migration, company_b.sdks]
    company_d: [company_d.distribution, company_d.webhooks, company_d.cicd]
    company_e: [company_e.wallet_api, company_e.fiat_crypto, company_e.ledger, company_e.reconciliation]
  projects: [proj.trading_platform, proj.booking_api]
  keywords: [backend, api, node, typescript, python, fastapi, postgresql, microservices, distributed, integration]

