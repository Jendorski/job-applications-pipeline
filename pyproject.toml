[project]
name = "jap"
version = "0.1.0"
description = "Job application pipeline: job links in, tailored CV and cover letter out"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "docxtpl>=0.19",
    "httpx>=0.28.1",
    "openai>=3.40.0",
    "pydantic>=2.9",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "trafilatura>=2.3.1",
    "typer>=0.12",
]

[project.scripts]
jap = "jap.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
