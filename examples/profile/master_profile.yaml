# Master profile: the single source of truth for every generated CV and cover letter.
#
# This is a fictional example (John Doe, Company A–E). Copy this folder to profile/ and replace
# everything with your own facts; profile/ is gitignored. The tests run against this example.
#
# Per-item fields:
#   source:   code | cv | user          where the claim comes from
#   status:   verified | needs_confirmation
#   evidence: repo(s) and the date range of your commits
#
# Pipeline rules:
#   - The tailor only sees items with status: verified.
#   - `show_on_cv: false` roles never appear as employers in a CV or letter. Their skills still
#     count toward the allow-list (real hands-on experience), but their bullets are not used.
#   - `hobby: true` projects are only offered for games / creative-tech roles.
#   - Terms in `never_claim` fail validation anywhere in generated output.
#   - Dates, titles, companies and contact details are copied verbatim, never generated.

person:
  name: John Doe
  email: john.doe@example.com
  links:
    - linkedin.com/in/john-doe-example/
    - github.com/john-doe-example
  location_line_template: "Open to relocating to {location}"
  career_start: 2019-06          # compute "N+ years"; never hard-code it

# ---------------------------------------------------------------------------
# Skills: canonical names = the validator's allow-list.
# ---------------------------------------------------------------------------
skills:
  languages: [TypeScript, JavaScript, Python, Rust, Kotlin, Java, C#, C++, Lua, GDScript, SQL, Bash]
  backend: [Node.js, Express, NestJS, Fastify, FastAPI, Axum, tokio, tsoa, tsyringe,
            REST API design, OpenAPI/Swagger, WebSockets, Socket.IO]
  data: [PostgreSQL, MongoDB, Mongoose, MySQL, MS SQL Server, Redis, SQLite, Firestore,
         SQLAlchemy, Alembic, Sequelize, TypeORM]
  async: [BullMQ, Bull, cron scheduling, outbox pattern, exponential backoff, idempotency,
          event-driven architecture, webhooks]
  industrial_iot: [machine-data ingestion,
                   remote write-back to devices, OEE/TEEP KPIs]
  integrations: [SAP (via MuleSoft), ERP REST APIs, Veriff, SumSub, Google OAuth, GitHub OAuth,
                 Apple OAuth, SendGrid, AWS S3, AWS SES, AWS SNS, Google Cloud Storage,
                 Slack alerts, exchange REST/WebSocket APIs, Fireblocks, BitGo,
                 virtual-account providers, Firebase Cloud Messaging]
  web3: [ethers.js, Web3.js, Avalanche, USDC, on-chain escrow, wallet signing, custodial wallets]
  ai_llm: [Anthropic API (Claude), LangGraph, LangChain, Qdrant,
           Model Context Protocol (MCP), agent-to-agent (A2A) systems]
  security: [JWT authentication, 2FA/OTP, role-based access control, API keys with scoped access,
             constant-time secret comparison, rate limiting, HashiCorp Vault, ClamAV file scanning]
  infrastructure: [Docker, Docker Compose, CI/CD, GitHub Actions, AWS, Bitbucket Pipelines,
                   Tailscale, Cloudflare Tunnel, Caddy, Railway, Heroku, Firebase, GCP Cloud Run,
                   Linux, VPS operations]
  frontend: [React, Vite, TanStack Query, deck.gl, Recharts, i18next, Tailwind CSS, React Email]
  testing: [pytest, Jest, Mocha, Vitest, high-coverage test suites, backtesting harnesses]
  tooling: [npm package publishing, SDK design, CLI design, Puppeteer]
  games: [Godot 4]

aliases:
  Postgres: PostgreSQL
  Mongo: MongoDB
  Node: Node.js
  NodeJS: Node.js
  Nest: NestJS
  TS: TypeScript
  JS: JavaScript
  SQL Server: MS SQL Server
  MSSQL: MS SQL Server
  GCS: Google Cloud Storage
  Socket.io: Socket.IO
  RBAC: role-based access control
  Claude API: Anthropic API (Claude)
  LLM API integration: Anthropic API (Claude)

